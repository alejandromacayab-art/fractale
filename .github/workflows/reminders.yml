name: Alertas de Fractale

on:
  schedule:
    # cada 30 minutos; send.js decide si en esta franja toca avisar
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      forzar:
        description: "Enviar una notificación de prueba ahora"
        type: choice
        options: [habits, screens, sueno]
        default: habits

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependencias
        working-directory: push
        run: npm install --no-audit --no-fund
      - name: Enviar alertas
        working-directory: push
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
        run: |
          if [ -n "${{ github.event.inputs.forzar }}" ]; then
            node send.js --force "${{ github.event.inputs.forzar }}"
          else
            node send.js
          fi
